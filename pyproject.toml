[tool.uv.workspace]
members = ["packages/pyvelo", "packages/pyvelo-intent", "packages/pyvelo-examples"]

[dependency-groups]
dev = [
    "pyvelo[analytics,dotenv]",
    "basedpyright>=1.40.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

[tool.uv.sources]
pyvelo = { workspace = true }
pyvelo-intent = { workspace = true }

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-ra", "-q", "-m", "not integration"]
testpaths = ["packages/pyvelo/tests", "packages/pyvelo-intent/tests"]
markers = ["integration: live VCO integration tests (require VCO_HOST + VCO_TOKEN)"]

[tool.basedpyright]
enableExperimentalFeatures = true
include = ["packages/pyvelo", "packages/pyvelo-intent"]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false
failOnWarnings = false
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
