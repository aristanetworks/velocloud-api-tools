[tool.uv.workspace]
members = ["packages/pyvelo", "packages/pyvelo-examples"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.3.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.28",
]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-ra", "-q", "-m", "not integration"]
testpaths = ["packages/pyvelo/tests"]
markers = ["integration: live VCO integration tests (require VCO_HOST + VCO_API_TOKEN)"]

[tool.basedpyright]
enableExperimentalFeatures = true
include = ["packages/pyvelo"]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
