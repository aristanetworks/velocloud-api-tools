[project]
name = "pyvelo"
version = "0.2.0"
description = "Python SDK for VeloCloud Orchestrator API"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "typing-extensions>=4.0",
    "httpx-ws>=0.8.2",
    "aiosqlite>=0.22.1",
    "polars>=1.41.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.12"]
build-backend = "uv_build"
