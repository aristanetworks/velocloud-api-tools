[project]
name = "pyvelo"
version = "0.2.0"
description = "Python SDK for VeloCloud Orchestrator API"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "httpx-ws>=0.8.2",
]

[project.optional-dependencies]
analytics = ["polars>=1.41.1"]
dotenv = ["python-dotenv>=1.2.2"]

[project.urls]
Repository = "https://github.com/aristanetworks/velocloud-api-tools"

[build-system]
requires = ["uv_build>=0.9.22,<0.14"]
build-backend = "uv_build"
